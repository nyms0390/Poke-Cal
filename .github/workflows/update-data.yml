name: Update Data

on:
  schedule:
    # Mondays 06:00 UTC. Smogon publishes last month's stats on the 1st-2nd,
    # so the first Monday run of each month also picks up the new SP spreads.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # Downloads and evaluates third-party upstream data (Showdown TypeScript is executed in a
  # permission-restricted child process). This job therefore gets read-only contents, no
  # persisted git credentials, and no tokens in its environment.
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install MCP test dependencies
        run: npm ci --prefix mcp --ignore-scripts

      - name: Snapshot committed catalogs as the validation baseline
        run: cp -R public "$RUNNER_TEMP/baseline"

      # Showdown base data, text, and the Champions mod come from the commit pinned in
      # scripts/showdown-pin.json (bumped by bump-showdown.yml pull requests), not from master.
      - name: Sync Showdown + Champions catalogs (pinned commit)
        run: npm run sync-data

      - name: Sync Limitless Champions usage and tournament teams
        run: npm run sync-champions-data

      - name: Sync Smogon Champions SP spreads
        run: npm run sync-champions-spreads

      - name: Sync NCP Champions curated sets
        run: npm run sync-ncp-spreads

      - name: Build slim browser catalogs
        run: npm run build-web-catalogs

      - name: Validate against the committed baseline
        run: npm run validate-data -- --baseline "$RUNNER_TEMP/baseline"

      - name: Run tests
        run: npm run test:all

      - name: Upload synced catalogs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-data
          path: public/
          if-no-files-found: error
          retention-days: 3

  # Runs only first-party code on the artifact: re-validates it, commits public/ only to the data
  # branch, merges it through a pull request once CI passes, and triggers the Pages deploy
  # (merges and pushes made with GITHUB_TOKEN do not trigger workflows).
  commit:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: bot/update-data
      TITLE: Update generated catalogs (Showdown/Champions, Limitless usage/teams, Smogon SP spreads, NCP sets)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download synced catalogs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: public-data
          path: ${{ runner.temp }}/synced

      - name: Re-validate synced catalogs against the committed baseline
        run: node scripts/validate-data.mjs --dir "$RUNNER_TEMP/synced" --baseline public

      # Only generated JSON (and icon PNGs) may come from the sync job.
      - name: Replace public/ with the synced catalogs
        run: >-
          rsync -a --delete --include='*/' --include='*.json' --include='*.png' --exclude='*'
          "$RUNNER_TEMP/synced/" public/

      # main is protected (pull request + passing `Tests` check, no bypass), so the bot can't push
      # there. It force-pushes a fixed branch, keeps one open PR for it, dispatches CI on it
      # (GITHUB_TOKEN pushes don't trigger workflows), waits for the check and merges the PR itself.
      # If CI fails, the job fails and the PR stays open for review.
      - name: Commit to the data branch and open or update its pull request
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -C "$BRANCH"
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          number=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "Updated pull request #$number."
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" \
              --body "Weekly catalog sync from the Update Data workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). The workflow merges this PR itself once the Tests check passes."
          fi

      - name: Run CI on the data branch and wait for it
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow ci.yml --event workflow_dispatch --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "CI run for $SHA did not start." >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 30

      - name: Merge the data pull request
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: gh pr merge "$BRANCH" --squash --delete-branch --match-head-commit "$SHA" --subject "$TITLE"

      - name: Deploy Pages
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
