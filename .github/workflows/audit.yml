name: Audit MCP dependencies

# Checks mcp/ (the public Cloudflare Worker) for high or critical npm advisories. It runs apart
# from pages.yml so a newly published advisory never blocks the site or Worker deploys; it fails
# visibly instead, and Dependabot (.github/dependabot.yml) proposes the update.
on:
  push:
    branches:
      - main
    paths:
      - "mcp/package.json"
      - "mcp/package-lock.json"
      - "mcp/scripts/check-audit.mjs"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "mcp/package.json"
      - "mcp/package-lock.json"
      - "mcp/scripts/check-audit.mjs"
      - ".github/workflows/audit.yml"
  schedule:
    # Mondays, after the weekly Dependabot run.
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Audit MCP dependencies
        run: npm run audit --prefix mcp
