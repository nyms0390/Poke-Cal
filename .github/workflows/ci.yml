name: CI

# The required check for main (branch ruleset, see docs/DECISIONS.md "Workflow"): the `Tests` job
# must pass before a pull request can merge. It runs on every pull request, and the bot workflows
# (update-data.yml, bump-showdown.yml) dispatch it on their branches, because pushes and pull
# requests made with GITHUB_TOKEN do not trigger workflows; a dispatched run reports the same
# `Tests` check on the branch head commit.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Keep this name: the main branch ruleset requires a check called "Tests".
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install MCP test dependencies
        run: npm ci --prefix mcp --ignore-scripts

      - name: Run app tests
        run: npm test

      - name: Run MCP tests
        run: npm run test:mcp

      - name: Validate committed catalogs
        run: npm run validate-data
